name = "portfolio-public-auth"
main = "src/index.ts"
compatibility_date = "2026-08-29"

[vars]
PUBLIC_AUTH_ORIGIN = "https://public-auth.syn-forge.com"
PORTFOLIO_ORIGIN = "https://syn-forge.com"
BROWSER_ORIGINS = "https://syn-forge.com,https://www.syn-forge.com,http://localhost:5173"
SESSION_COOKIE_SAME_SITE = "None"
GOOGLE_REDIRECT_URI = "https://public-auth.syn-forge.com/oauth/google/callback"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "portfolio-agent-auth"
database_id = "5921ab3b-ebd6-4377-a474-4618d78f4aa4"
migrations_dir = "migrations"

[[services]]
binding = "AGENT_WORKER"
service = "portfolio-agent"

[[routes]]
pattern = "public-auth.syn-forge.com"
custom_domain = true

[env.local]
name = "portfolio-public-auth-local"
compatibility_date = "2026-08-27"
routes = []

[env.local.vars]
PUBLIC_AUTH_ORIGIN = "http://localhost:8787"
PORTFOLIO_ORIGIN = "http://localhost:5173"
BROWSER_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
SESSION_COOKIE_SAME_SITE = "Lax"
GOOGLE_REDIRECT_URI = "http://localhost:8787/oauth/google/callback"

[[env.local.d1_databases]]
binding = "AUTH_DB"
database_name = "portfolio-agent-auth"
database_id = "5921ab3b-ebd6-4377-a474-4618d78f4aa4"
migrations_dir = "migrations"

[[env.local.services]]
binding = "AGENT_WORKER"
service = "portfolio-agent-local"

[observability.logs]
enabled = true
invocation_logs = true
